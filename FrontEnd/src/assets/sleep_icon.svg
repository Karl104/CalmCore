<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="150" height="150">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clouds -->
  <path d="M 50 40 Q 60 20 80 35 T 110 30 Q 130 20 150 40 Z" fill="#d3d3d3" opacity="0.8" />
  <path d="M 70 50 Q 80 35 100 45 T 130 40 Q 145 35 160 50 Z" fill="#e0e0e0" opacity="0.7" />

  <!-- Moon -->
  <path d="M 140 20 A 20 20 0 1 0 140 60 A 15 15 0 1 1 145 25 Z" fill="#f5f5f5" />

  <!-- Book -->
  <path d="M 30 130 L 30 70 Q 30 60 40 60 L 95 60 Q 100 60 100 65 L 100 130 Q 100 135 95 135 L 40 135 Q 30 135 30 130 Z" fill="url(#bookGradient)" filter="url(#shadow)"/>
  <path d="M 170 130 L 170 70 Q 170 60 160 60 L 105 60 Q 100 60 100 65 L 100 130 Q 100 135 105 135 L 160 135 Q 170 135 170 130 Z" fill="url(#bookGradient)" filter="url(#shadow)"/>
  <rect x="98" y="60" width="4" height="75" fill="#a9a9a9" />

  <!-- Feather/Leaf -->
  <path d="M 50 75 Q 40 95 55 115 T 65 125 L 60 110 Q 70 90 50 75 Z" fill="#f0f0f0" transform="rotate(-15 50 100)"/>
  <line x1="60" y1="118" x2="50" y2="80" stroke="#c0c0c0" stroke-width="1"/>

  <!-- Stars/Sparkles -->
  <circle cx="165" cy="55" r="1.5" fill="#f5f5f5" />
  <circle cx="175" cy="65" r="1" fill="#f5f5f5" />

</svg>